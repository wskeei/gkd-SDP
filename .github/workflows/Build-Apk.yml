name: Build Latest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'LICENSE'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: latest-apk-release
  cancel-in-progress: true

jobs:
  build-latest:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (!startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'chore('))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Test selector and app
        run: |
          chmod +x ./gradlew
          ./gradlew :selector:jvmTest :app:testGkdDebugUnitTest

      - name: Configure release signing
        run: |
          if [ -z "${{ secrets.GKD_STORE_FILE_BASE64 }}" ]; then
            echo "Missing signing secret: GKD_STORE_FILE_BASE64" >&2
            exit 1
          fi
          echo "${{ secrets.GKD_STORE_FILE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/gkd-sdp.jks"
          {
            echo "GKD_STORE_FILE=${{ github.workspace }}/gkd-sdp.jks"
            echo "GKD_STORE_PASSWORD=${{ secrets.GKD_STORE_PASSWORD }}"
            echo "GKD_KEY_ALIAS=${{ secrets.GKD_KEY_ALIAS }}"
            echo "GKD_KEY_PASSWORD=${{ secrets.GKD_KEY_PASSWORD }}"
          } >> gradle.properties

      - name: Build release APK
        run: |
          ./gradlew :app:assembleGkdRelease

      - name: Prepare APK asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/gkd/release/app-gkd-release.apk release/gkd-sdp-latest.apk

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          rm -f "$GITHUB_WORKSPACE/gkd-sdp.jks"
          sed -i \
            -e '/^GKD_STORE_FILE=/d' \
            -e '/^GKD_STORE_PASSWORD=/d' \
            -e '/^GKD_KEY_ALIAS=/d' \
            -e '/^GKD_KEY_PASSWORD=/d' \
            "$GITHUB_WORKSPACE/gradle.properties"

      - name: Move latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin latest

      - name: Publish latest prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: GKD-SDP Latest
          body: |
            Automated latest build for `${{ github.sha }}`.

            This release is refreshed on every successful push to `main`.
          prerelease: true
          make_latest: false
          files: release/gkd-sdp-latest.apk
          fail_on_unmatched_files: true
          overwrite_files: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gkd-sdp-latest-apk
          path: release/gkd-sdp-latest.apk
