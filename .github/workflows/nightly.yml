name: Nightly

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Verify release metadata
        run: bash scripts/verify-release-metadata.sh --no-tag

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGkdDebug

      - name: Upload Nightly APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gkd-sdp-nightly-${{ github.sha }}-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/gkd/debug/app-gkd-debug.apk
