name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Verify release metadata and Python contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 scripts/verify-localization-resources.py
          python3 scripts/verify-localization-sources.py
          bash scripts/test-verify-release-metadata.sh
          bash scripts/test-generate-update-manifest.sh
          bash scripts/verify-release-metadata.sh --no-tag

      - name: Run unit tests and lint
        run: |
          ./gradlew \
            :quality-lint:test \
            :selector:jvmTest \
            :app:testGkdDebugUnitTest \
            :app:lintGkdDebug \
            :app:lintPlayDebug

      - name: Verify coverage and screenshots
        run: |
          ./gradlew :app:koverVerifyGkdDebug
          ./gradlew :app:koverXmlReportGkdDebug
          python3 scripts/verify-kover-report.py \
            --xml app/build/reports/kover/reportGkdDebug.xml \
            --includes config/quality/kover-includes.txt \
            --excludes config/quality/kover-excludes.txt
          ./gradlew :app:validateGkdDebugScreenshotTest

      - name: Run API 26 managed device tests
        run: |
          ./gradlew :app:pixel2Api26GkdDebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=30

      - name: Run API 35 managed device tests
        run: |
          ./gradlew \
            :app:pixel6Api35GkdDebugAndroidTest \
            :app:pixel6Api35PlayDebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=30

      - name: Generate Baseline Profile and run macrobenchmarks
        run: |
          ./gradlew :app:generateGkdReleaseBaselineProfile \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=30
          ./gradlew :baselineprofile:pixel6Api35GkdNonMinifiedReleaseAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=30

      - name: Build all variants and verify performance policy
        run: |
          ./gradlew \
            :app:assembleGkdDebug \
            :app:assemblePlayDebug \
            :app:assembleGkdRelease \
            :app:assemblePlayRelease
          git worktree add --detach .worktrees/performance-baseline v2.2.1
          ./gradlew -p .worktrees/performance-baseline :app:assembleGkdRelease
          python3 scripts/verify-performance-reports.py \
            --thresholds config/quality/performance-thresholds.json \
            --current-apk app/build/outputs/apk/gkd/release/app-gkd-release.apk \
            --baseline-apk .worktrees/performance-baseline/app/build/outputs/apk/gkd/release/app-gkd-release.apk \
            --compose-report app/build/compose_compiler \
            --compose-baseline config/quality/compose-stability-baseline.json

      - name: Upload Nightly APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gkd-sdp-nightly-${{ github.sha }}-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/gkd/debug/app-gkd-debug.apk

      - name: Upload quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-reports-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/reports/
            app/build/reports/
            app/build/outputs/managed_device_android_test_additional_output/
            baselineprofile/build/outputs/managed_device_android_test_additional_output/
