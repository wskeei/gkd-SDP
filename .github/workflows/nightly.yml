name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Verify contracts and release metadata
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          bash scripts/test-verify-release-metadata.sh
          bash scripts/test-generate-update-manifest.sh
          bash scripts/verify-release-metadata.sh --no-tag

      - name: Generate security dependency report
        run: bash scripts/generate-security-dependency-report.sh

      - name: Verify security dependency floors
        run: |
          python3 scripts/verify-security-dependency-report.py \
            --report build/reports/security-dependencies.txt

      - name: Run unit tests and lint
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :selector:jvmTest \
            :app:testGkdDebugUnitTest \
            :app:lintGkdDebug \
            :app:lintPlayDebug

      - name: Build all variants
        run: |
          ./gradlew \
            :app:assembleGkdDebug \
            :app:assemblePlayDebug \
            :app:assembleGkdRelease \
            :app:assemblePlayRelease

      - name: Install release smoke emulator image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Smoke test minified release APKs
        run: |
          bash scripts/run-release-apk-smoke-emulator.sh \
            --api 35 \
            --apk app/build/outputs/apk/gkd/release/app-gkd-release.apk \
            --apk app/build/outputs/apk/play/release/app-play-release.apk

      - name: Upload Nightly APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gkd-sdp-nightly-${{ github.sha }}-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/gkd/debug/app-gkd-debug.apk

      - name: Upload quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-reports-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/reports/
            app/build/reports/
            app/build/test-results/
            selector/build/reports/
            selector/build/test-results/
