name: Build Tagged Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Configure release signing
        run: |
          if [ -z "${{ secrets.GKD_STORE_FILE_BASE64 }}" ]; then
            echo "Missing signing secret: GKD_STORE_FILE_BASE64" >&2
            exit 1
          fi
          echo "${{ secrets.GKD_STORE_FILE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/gkd-sdp.jks"
          {
            echo "GKD_STORE_FILE=${{ github.workspace }}/gkd-sdp.jks"
            echo "GKD_STORE_PASSWORD=${{ secrets.GKD_STORE_PASSWORD }}"
            echo "GKD_KEY_ALIAS=${{ secrets.GKD_KEY_ALIAS }}"
            echo "GKD_KEY_PASSWORD=${{ secrets.GKD_KEY_PASSWORD }}"
          } >> gradle.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleGkdRelease

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/gkd/release/app-gkd-release.apk "release/gkd-sdp-${{ github.ref_name }}.apk"
          zip -r "release/gkd-sdp-outputs-${{ github.ref_name }}.zip" app/build/outputs

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: GKD-SDP ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            release/gkd-sdp-${{ github.ref_name }}.apk
            release/gkd-sdp-outputs-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: gkd-sdp-release-assets
          path: release
