name: Build Tagged Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Test selector and app
        run: |
          chmod +x ./gradlew
          ./gradlew :selector:jvmTest :app:testGkdDebugUnitTest

      - name: Configure release signing
        run: |
          if [ -z "${{ secrets.GKD_STORE_FILE_BASE64 }}" ]; then
            echo "Missing signing secret: GKD_STORE_FILE_BASE64" >&2
            exit 1
          fi
          echo "${{ secrets.GKD_STORE_FILE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/gkd-sdp.jks"
          {
            echo "GKD_STORE_FILE=${{ github.workspace }}/gkd-sdp.jks"
            echo "GKD_STORE_PASSWORD=${{ secrets.GKD_STORE_PASSWORD }}"
            echo "GKD_KEY_ALIAS=${{ secrets.GKD_KEY_ALIAS }}"
            echo "GKD_KEY_PASSWORD=${{ secrets.GKD_KEY_PASSWORD }}"
          } >> gradle.properties

      - name: Build release APK
        run: |
          ./gradlew :app:assembleGkdRelease

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/gkd/release/app-gkd-release.apk "release/gkd-sdp-${{ github.ref_name }}.apk"
          zip -r "release/gkd-sdp-outputs-${{ github.ref_name }}.zip" app/build/outputs

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          rm -f "$GITHUB_WORKSPACE/gkd-sdp.jks"
          sed -i \
            -e '/^GKD_STORE_FILE=/d' \
            -e '/^GKD_STORE_PASSWORD=/d' \
            -e '/^GKD_KEY_ALIAS=/d' \
            -e '/^GKD_KEY_PASSWORD=/d' \
            "$GITHUB_WORKSPACE/gradle.properties"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: GKD-SDP ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            release/gkd-sdp-${{ github.ref_name }}.apk
            release/gkd-sdp-outputs-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gkd-sdp-release-assets
          path: release
