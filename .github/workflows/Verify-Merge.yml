name: Verify Merge

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'merge/**'
    paths-ignore:
      - 'LICENSE'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: verify-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Test selector and app
        run: |
          chmod +x ./gradlew
          ./gradlew :selector:jvmTest :app:testGkdDebugUnitTest

      - name: Build debug and release APKs
        run: |
          ./gradlew \
            :app:assembleGkdDebug \
            :app:assemblePlayDebug \
            :app:assembleGkdRelease

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: merge-verification-outputs
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
            app/schemas/
            selector/build/reports/
            selector/build/test-results/
          if-no-files-found: ignore
