name: 错误反馈 / Bug report
description: 报告可以在 GKD-SDP 中复现的问题
title: "[BUG] "
labels:
  - bug
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue/Discussion，并确认问题属于 GKD-SDP，而不是第三方订阅规则或上游 GKD。

        **隐私提示：** 上传日志、截图或录屏前，请删除申请理由、账号、URL、token、通知正文和其他屏幕敏感内容。不要上传 keystore 或密码。
  - type: input
    id: version
    attributes:
      label: GKD-SDP 版本
      description: 例如 2.0.0-beta.1，以及 Release/Nightly/自行构建来源
      placeholder: 2.0.0-beta.1 (Release)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备和 Android 版本
      placeholder: 厂商、型号、Android 版本、ROM
    validations:
      required: true
  - type: dropdown
    id: runtime-mode
    attributes:
      label: 运行模式
      options:
        - Accessibility 无障碍
        - Automation / Shizuku 自动化
        - 两种模式都复现
        - 不确定
    validations:
      required: true
  - type: input
    id: permissions
    attributes:
      label: 相关权限状态
      description: 只写开/关即可，不要粘贴系统日志
      placeholder: 通知开，悬浮窗开，无障碍开，Shizuku 未使用
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options:
        - 使用申请
        - 应用拦截 / URL 拦截
        - 专注模式 / Self Control
        - 自动重开 / 无障碍守护
        - 订阅选择器 / GKD 核心
        - 更新 / 构建 / Release
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 请使用编号步骤，避免只写“不能用”
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: 回归信息和脱敏证据
      description: 上一个正常版本、复现频率，以及必要的脱敏日志/截图链接；不要求所有问题上传原始日志
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过相似 Issue/Discussion。
          required: true
        - label: 我已删除申请理由、账号、URL、token、密码和不必要的屏幕内容。
          required: true
        - label: 这是 GKD-SDP 应用本体的问题，而不是第三方规则内容的问题。
          required: true
