name: 功能请求 / Feature request
description: 提出面向 GKD-SDP 的可执行改进
title: "[Feature] "
labels:
  - enhancement
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        复杂或尚不确定的想法可以先发到 [Discussions](https://github.com/wskeei/gkd-SDP/discussions)。

        请避免在功能描述中写入真实申请理由、账号、URL 或其他个人信息。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明真实使用场景、当前痛点和受影响的用户
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明页面、规则、通知或运行时应如何变化
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: impact
    attributes:
      label: 权限、隐私、电量和兼容性影响
      description: 是否涉及无障碍、悬浮窗、通知、后台服务、Shizuku、数据库或敏感数据
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收条件
      description: 用具体结果描述什么时候算完成
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过相似 Issue/Discussion。
          required: true
        - label: 我理解该需求需要维护者评估，不保证合并或按指定时间实现。
          required: true
